# ⭐ Plan B — LiveKit auto-hébergé gratuit (bascule de secours)
# VM Oracle Cloud Always Free (4 OCPU ARM, 24 Go RAM, 10 To/mois).
# Démarrage : docker compose up -d
# Guide complet : README.md (domaine/TLS, génération des clés, bascule Vercel).

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7880"]
      interval: 30s
      timeout: 5s
      retries: 3

  # TLS automatique (Let's Encrypt) + reverse proxy wss://domaine → LiveKit:7880
  # Modifier le domaine dans Caddyfile avant le premier démarrage.
  caddy:
    image: caddy/caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3 (WebSocket fallback)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  caddy_data:
  caddy_config:
